# ============================================================
# APPLICATION
# ============================================================

spring.application.name=InsuranceManagementSystem


# ============================================================
# DATABASE - MYSQL
# ============================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/insurance_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# CONNECTION POOL - HIKARI
# ============================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ============================================================
# CACHE - CAFFEINE
# ============================================================

spring.cache.type=caffeine
spring.cache.cache-names=insuranceProducts,policies
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
management.info.env.enabled=true


# ============================================================
# LOGGING
# ============================================================

logging.level.com.example.insurance=INFO
logging.level.org.springframework.security=INFO


# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ============================================================
# SCHEDULER
# ============================================================

# LOCAL DEVELOPMENT ONLY: replace with your own randomly generated secret
app.jwt.secret=${JWT_SECRET}

insurance.scheduler.expiry-rate=300000
insurance.scheduler.payment-rate=300000

# JWT configuration
app.jwt.expiration-ms=3600000

# OTP configuration
app.otp.expiration-minutes=5
app.otp.max-attempts=5

# Development OTP logging
app.otp.log-to-console=false

app.policy.expiry-cron=0 0 1 * * *

# Claim document storage
insurance.file.upload-dir=uploads/claim-documents
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB